<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title><iPhone Calculator UI></title>
      <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="calculator">
      <div class="display-container">
        <div class="display" id="display">0</div>
        <div class="display-result">0</div>
      </div>
      <div class="buttons-grid">
             <!-- Row 1: Utilities & Division -->
            <button class="btn btn-utility" data-action="clear"><span>AC</span></button>
            <button class="btn btn-utility" data-action="toggle-sign"><span>±</span></button>
            <button class="btn btn-utility" data-action="percentage"><span>%</span></button>
            <button class="btn btn-operator" data-action="divide"><span>÷</span></button>

            <!-- Row 2: 7, 8, 9 & Multiplication -->
            <button class="btn btn-number" data-value="7"><span>7</span></button>
            <button class="btn btn-number" data-value="8"><span>8</span></button>
            <button class="btn btn-number" data-value="9"><span>9</span></button>
            <button class="btn btn-operator" data-action="multiply"><span>x</span></button>

             <!-- Row 3: 4, 5, 6 & Subtraction -->
            <button class="btn btn-number" data-value="4"><span>4</span></button>
            <button class="btn btn-number" data-value="5"><span>5</span></button>
            <button class="btn btn-number" data-value="6"><span>6</span></button>
            <button class="btn btn-operator" data-action="subtract"><span>-</span></button>

            <!-- Row 4: 1, 2, 3 & Addition -->
            <button class="btn btn-number" data-value="1"><span>4</span></button>
            <button class="btn btn-number" data-value="2"><span>5</span></button>
            <button class="btn btn-number" data-value="3"><span>6</span></button>
            <button class="btn btn-operator" data-action="add"><span>+</span></button>

            <!-- Row 4: Backspace, 0, . & = -->
            <button class="btn btn-icon" data-value="backspace"><span>&#x232B</span></button>
            <button class="btn btn-number" data-value="0"><span>0</span></button>
            <button class="btn btn-decimal" data-value="."><span>.</span></button>
            <button class="btn btn-operator" data-action="equals"><span>=</span></button>











      </div>
  </body>
